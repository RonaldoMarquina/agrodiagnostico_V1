map $request_id $correlation_id {
    "~^(.{8})(.{4})(.{4})(.{4})(.{12})$" "$1-$2-$3-$4-$5";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    location ^~ /internal { return 404; }
    location ^~ /health { return 404; }
    location ^~ /ai { return 404; }
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        add_header X-Correlation-ID $correlation_id always;
        return 404 '{"code":"NOT_IMPLEMENTED","message":"Ruta no disponible en el entorno técnico.","correlation_id":"$correlation_id"}';
    }
    location / { try_files $uri $uri/ =404; }
}
