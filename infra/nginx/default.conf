map $request_id $correlation_id {
    "~^(.{8})(.{4})(.{4})(.{4})(.{12})$" "$1-$2-$3-$4-$5";
}

map $http_x_correlation_id $correlation_header {
    default $http_x_correlation_id;
    "" $correlation_id;
}

upstream identity_backend {
    server identity:8000;
}

upstream diagnosis_backend {
    server diagnosis:8000;
}

upstream notification_backend {
    # Resolve at runtime so the proxy can start when Notification is absent.
    zone notification_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server notification:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Rutas internas y de monitoreo bloqueadas
    location ^~ /internal { return 404; }
    location ^~ /health { return 404; }
    location ^~ /ai { return 404; }

    # Incremento 1: Identity & Authorization
    location /api/v1/auth/ {
        proxy_pass http://identity_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    location /api/v1/profile {
        proxy_pass http://identity_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    # Incremento 1: Admin Users (Identity)
    location = /api/v1/admin/users {
        proxy_pass http://identity_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    location /api/v1/admin/users/ {
        proxy_pass http://identity_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    # Incremento 5: Identity - Admin Security Audit (ADR-0016)
    location = /api/v1/admin/audit/identity {
        proxy_pass http://identity_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    # Incremento 2: Diagnosis - Diagnoses (límite de transporte 11 MiB)
    location = /api/v1/diagnoses {
        client_max_body_size 11m;
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    location /api/v1/diagnoses/ {
        client_max_body_size 11m;
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    # Incremento 2: Diagnosis - Crops
    location = /api/v1/crops {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    location /api/v1/crops/ {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    # Incremento 2: Diagnosis - Problems
    location /api/v1/problems/ {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    # Incremento 2: Diagnosis - Admin Crops
    location = /api/v1/admin/crops {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    location /api/v1/admin/crops/ {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    # Incremento 2: Diagnosis - Admin Problems
    location = /api/v1/admin/problems {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    location /api/v1/admin/problems/ {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    # Incremento 2: Diagnosis - Admin Recommendations
    location = /api/v1/admin/recommendations {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    location /api/v1/admin/recommendations/ {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    # Incremento 2: Diagnosis - Admin Diagnoses
    location = /api/v1/admin/diagnoses {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    location /api/v1/admin/diagnoses/ {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    # Incremento 5: Diagnosis - Admin Audit, Metrics, Models & System Status (ADR-0016)
    location = /api/v1/admin/audit/diagnosis {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    location = /api/v1/admin/metrics/summary {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    location = /api/v1/admin/models {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    location = /api/v1/admin/system/status {
        proxy_pass http://diagnosis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    # Incremento 5: Notification - Avisos y preferencias de correo
    location = /api/v1/notifications {
        proxy_pass http://notification_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    location /api/v1/notifications/ {
        proxy_pass http://notification_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    location = /api/v1/notification-preferences {
        proxy_pass http://notification_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
    }

    # Extensión desacoplada: Assistant (perfil Compose --profile assistant)
    location = /api/v1/assistant/messages {
        client_max_body_size 16k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $assistant_upstream http://assistant:8000;
        proxy_pass $assistant_upstream;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_header;
        error_page 413 = @assistant_payload_too_large;
        error_page 502 503 504 = @assistant_unavailable;
    }

    location @assistant_payload_too_large {
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        add_header X-Correlation-ID $correlation_header always;
        return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"La solicitud excede el tamaño máximo permitido.","correlation_id":"$correlation_header"}';
    }

    location @assistant_unavailable {
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        add_header X-Correlation-ID $correlation_header always;
        return 503 '{"code":"ASSISTANT_UNAVAILABLE","message":"El asistente no está disponible en este momento. Puedes continuar usando la navegación manual.","correlation_id":"$correlation_header"}';
    }

    # Deferred / unimplemented API routes
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        add_header X-Correlation-ID $correlation_header always;
        return 404 '{"code":"NOT_IMPLEMENTED","message":"Ruta no disponible en el entorno técnico.","correlation_id":"$correlation_header"}';
    }

    location / { try_files $uri $uri/ =404; }
}
