map $request_id $correlation_id {
    "~^(.{8})(.{4})(.{4})(.{4})(.{12})$" "$1-$2-$3-$4-$5";
}

upstream identity_backend {
    server identity:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location ^~ /internal { return 404; }
    location ^~ /health { return 404; }
    location ^~ /ai { return 404; }

    # Incremento 1: Identity & Authorization endpoints
    location /api/v1/auth/ {
        proxy_pass http://identity_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/profile {
        proxy_pass http://identity_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/admin/ {
        proxy_pass http://identity_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deferred / unimplemented API routes
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        add_header X-Correlation-ID $correlation_id always;
        return 404 '{"code":"NOT_IMPLEMENTED","message":"Ruta no disponible en el entorno técnico.","correlation_id":"$correlation_id"}';
    }

    location / { try_files $uri $uri/ =404; }
}
