name: Application CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4
        with:
          version: 'v29.1.3'
      - uses: docker/setup-compose-action@2fe291b7677a45ee1269ec56a42604c143505e7e
        with:
          version: 'v2.40.3'
      - name: Prepare locked CI tools
        run: bash scripts/prepare_ci.sh
      - name: Application checks
        run: python3 scripts/run_ci.py --artifacts .local/ci/application
      - name: Cleanup isolated projects
        if: always()
        run: python3 scripts/cleanup_ci.py --artifacts .local/ci/application
      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: application-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci/application/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
