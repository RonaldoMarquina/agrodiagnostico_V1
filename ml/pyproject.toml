[project]
name = "agrodiagnostico-ml"
version = "0.1.0"
description = "Herramientas reproducibles de ML para CPU: entrenamiento, calibracion, evaluacion y empaquetado V1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pillow==12.3.0",
  "jsonschema==4.26.0",
  "cryptography>=42.0.0",
  "torch==2.15.0+cpu",
  "torchvision==0.29.2+cpu",
  "safetensors==0.8.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agro_ml"]

[project.scripts]
agro-ml = "agro_ml.cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = true
required-version = "==0.12.20"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
